name: Data Ingest

on:
  workflow_dispatch:

  issues:
    types: [opened]
    inputs:
      source_type:
        description: "数据来源"
        required: true
        type: choice
        options:
          - shopee_datafeed
          - product_csv
          - product_url
          - other
      product_url:
        description: "商品 URL（如果是商品网址）"
        required: false
        type: string
permissions:
  contents: write
  
jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Input
        env:
          SOURCE_TYPE: ${{ inputs.source_type }}
          PRODUCT_URL: ${{ inputs.product_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "=== DATA INGEST ==="

          if [ -n "$ISSUE_BODY" ]; then
            echo "Source: GitHub Issue"
            echo "Issue Body:"
            echo "$ISSUE_BODY"
          else
            echo "Source type: $SOURCE_TYPE"
            echo "Product URL: $PRODUCT_URL"
          fi
    
      - name: Save Submission
        run: |
          mkdir -p data/inbox

          cat > data/inbox/latest_submission.json <<'JSON'
          {
            "source_type": "${{ inputs.source_type }}",
            "product_url": "${{ inputs.product_url }}",
            "status": "received"
          }
          JSON

      - name: Verify
        run: |
          test -f data/inbox/latest_submission.json
          cat data/inbox/latest_submission.json
          echo "Data Ingest: OK"
