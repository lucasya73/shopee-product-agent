name: Test Product Agent

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Browser
        run: playwright install chromium
  
      - name: Test Config Loader
        run: python config_loader.py

      - name: Test Collector
        run: python collector.py "https://shopee.sg/"

      - name: Test URL Resolver
        run: python url_resolver.py "https://s.shopee.sg/2qV98KrxeD"

      - name: Test Parser
        run: python parser.py "https://shopee.sg/opaanlp/77264859/21692161576"

      - name: Test CSV Collector
        run: |
             python csv_collector.py product_feed_test_3rows.csv 3
             test -f products.json
             python -c "import json; data=json.load(open('products.json', encoding='utf-8')); print('JSON products:', len(data)); print('JSON valid: OK')"
    
      - name: Test Normalizer
        run: |
             python normalizer.py
             test -f normalized_products.json
             python -c "import json; data=json.load(open('normalized_products.json', encoding='utf-8')); print('Normalized products:', len(data)); print('Normalized JSON valid: OK')"

      - name: Test Validator
        run: |
             python validator.py
             test -f validated_products.json
             python -c "import json; data=json.load(open('validated_products.json', encoding='utf-8')); print('Validated products:', len(data)); print('Status:', data[0]['system']['status'] if data else 'EMPTY'); print('Validated JSON valid: OK')"
     
      - name: Test Product Intelligence
        run: |
             python product_intelligence.py
             test -f intelligence_products.json
             python -c "import json; data=json.load(open('intelligence_products.json', encoding='utf-8')); print('Intelligence products:', len(data)); print('Status:', data[0]['system']['status'] if data else 'EMPTY'); print('Intelligence JSON valid: OK')"

      - name: Test Scorer
        run: |
             python scorer.py
             test -f scored_products.json
             python -c "import json; data=json.load(open('scored_products.json', encoding='utf-8')); print('Scored products:', len(data)); print('Status:', data[0]['system']['status'] if data else 'EMPTY'); print('Top score:', data[0]['scores']['total'] if data else 'EMPTY'); print('Scored JSON valid: OK')"

      - name: Test Selector
        run: |
             python selector.py
             test -f selected_products.json
             python - <<'PY'
             import json

             with open(
                 "selected_products.json",
                 "r",
                 encoding="utf-8"
             ) as file:
                 data = json.load(file)

             print("Selected products:", len(data))

             if data:
                  print(
                      "Status:",
                  data[0]["system"]["status"]
                  )

             print("Selection JSON valid: OK")
             PY
       
      - name: Test Content Strategy
        run: |
             python content_strategy.py
             test -f content_strategy.json
             python - <<'PY'
             import json

             with open(
                 "content_strategy.json",
                 "r",
                 encoding="utf-8"
             ) as file:
                 data = json.load(file)

             print("Strategy products:", len(data))

             if data:
                 strategy = data[0]["content_strategy"]
                 print("Status:", data[0]["system"]["status"])
                 print("Target:", strategy["target_customer"])
                 print("Hook:", strategy["primary_hook"])
                 print("Demo:", strategy["primary_demo"])
                 print("Directions:", len(strategy["content_directions"]))

             print("Content Strategy JSON valid: OK")
             PY
      - name: Test Content Factory
        run: |
             python content_factory.py
             test -f content_factory.json
             python - <<'PY'
             import json

             with open(
                 "content_factory.json",
                 "r",
                 encoding="utf-8"
             ) as file:
                 data = json.load(file)

             print("Content products:", len(data))

             if data:
                 content = data[0]

                 print("Status:", content["status"])
                 print("Images:", len(content["product_images"]))
                 print("Tags length:", len(content["product_tags"]))
                 print(
                     "Video prompt:",
                     "OK" if content["video_prompt"] else "EMPTY"
                 )

                 assert 1 <= len(content["product_images"]) <= 3
                 assert len(content["product_tags"]) <= 150
                 assert content["video_prompt"]

             print("Content Factory final output: OK")
             PY
